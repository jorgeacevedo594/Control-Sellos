<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#034798">
<title>ESM · Control de Sellos</title>
<meta http-equiv="refresh" content="1; url=https://sellos-esm.pages.dev/">
<link rel="canonical" href="https://sellos-esm.pages.dev/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;
    background:#eef2f7;color:#1a2231;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center}
  .box{background:#fff;border-radius:16px;padding:24px 20px;max-width:380px;width:100%;box-shadow:0 6px 18px rgba(3,71,152,.08)}
  img{height:40px}
  h1{font-size:19px;color:#023368;margin:14px 0 6px}
  p{font-size:14.5px;color:#5b6a82;margin:0 0 14px}
  a.btn{display:block;background:#034798;color:#fff;text-decoration:none;font-weight:700;border-radius:11px;padding:13px 16px}
  small{display:block;margin-top:14px;color:#5b6a82;font-size:12.5px}
</style>
<script>
  // La app se trasladó: se borra lo que el prototipo guardó en el teléfono y se abre la app nueva
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
  try { if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); } catch (e) {}
  setTimeout(function () { location.replace('https://sellos-esm.pages.dev/'); }, 400);
</script>
</head>
<body>
  <div class="box">
    <img src="img/logo-esm.png" alt="ESM">
    <h1>Control de Sellos cambió de dirección</h1>
    <p>Te estamos llevando a la nueva app…</p>
    <a class="btn" href="https://sellos-esm.pages.dev/">Abrir Control de Sellos</a>
    <small>Si tenías el ícono antiguo en tu teléfono, bórralo y agrega el de la app nueva.</small>
  </div>
</body>
</html>
