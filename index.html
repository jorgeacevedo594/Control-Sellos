<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#034798">
<title>ESM · Control de Sellos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --esm:#034798; --esm-dark:#023368; --esm-soft:#e8f0fb; --esm-line:#c7d6ea;
  --ink:#1a2231; --muted:#5b6a82; --bg:#eef2f7; --card:#fff;
  --ok:#1f9d57; --ok-soft:#e3f5ea; --warn:#b86a06; --warn-soft:#fdf1df;
  --danger:#c0392b; --danger-soft:#fbe6e3; --info:#2a6fdb; --info-soft:#e6efff;
  --grey:#6b7685; --grey-soft:#eef0f3; --radius:14px;
  --shadow:0 1px 3px rgba(3,71,152,.08),0 6px 18px rgba(3,71,152,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4}
img{max-width:100%}
button{font-family:inherit}
/* Header */
header.app{position:sticky;top:0;z-index:40;background:var(--esm);color:#fff;padding:9px 12px;
  padding-top:max(9px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header.app .logo{background:#fff;border-radius:8px;padding:4px 7px;display:flex;align-items:center;height:36px;cursor:pointer}
header.app .logo img{height:26px;display:block}
header.app .ht{font-size:13px;font-weight:700;line-height:1.15;flex:1;min-width:0}
header.app .ht small{display:block;font-weight:400;opacity:.85;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.app .hchip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;
  padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.demo-banner{background:#fff7e0;color:#7a5200;font-size:11.5px;text-align:center;padding:5px 10px;border-bottom:1px solid #f0dca6}
main{max-width:760px;margin:0 auto;padding:14px 12px 110px}
h1.title{font-size:20px;margin:4px 2px 2px;color:var(--esm-dark)}
p.lead{margin:0 2px 14px;color:var(--muted);font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--esm);font-weight:700;font-size:14px;padding:6px 2px;margin-bottom:4px;cursor:pointer}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden;border:1px solid #eaeef4}
.card>.head{display:flex;align-items:center;gap:8px;background:var(--esm);color:#fff;padding:11px 14px;font-weight:700;font-size:14.5px}
.card>.head .sub{font-weight:400;opacity:.85;font-size:12px;margin-left:auto;text-align:right}
.card>.body{padding:13px 14px}
.muted{color:var(--muted)} .small{font-size:12.5px} .center{text-align:center}
.field{margin:0 0 11px} .field:last-child{margin-bottom:0}
label.l{display:block;font-size:12.5px;font-weight:700;color:var(--esm-dark);margin:0 0 4px}
input,select,textarea{width:100%;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--esm-line);
  border-radius:10px;padding:10px 11px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--esm)}
textarea{resize:vertical;min-height:46px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:11px;font-weight:700;
  font-size:15px;padding:12px 16px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--esm);color:#fff} .btn.primary:disabled{background:#9db3d3}
.btn.ghost{background:var(--esm-soft);color:var(--esm)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid var(--esm-line);
  padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;box-shadow:0 -3px 14px rgba(3,71,152,.07)}
.bottombar .btn{flex:1}
.bottombar .info{flex:0 0 auto;align-self:center;font-size:12px;color:var(--muted);max-width:40%}
/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.alert{background:var(--danger-soft);color:var(--danger)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.grey{background:var(--grey-soft);color:var(--grey)} .chip.blue{background:var(--esm-soft);color:var(--esm)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
/* Login */
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.rolecard{background:#fff;border:2px solid var(--esm-line);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.rolecard.sel{border-color:var(--esm);background:var(--esm-soft)}
.rolecard .ab{width:44px;height:44px;border-radius:50%;background:var(--esm);color:#fff;font-weight:800;display:grid;place-items:center;margin:0 auto 6px;font-size:15px}
.rolecard b{display:block;font-size:13.5px;color:var(--esm-dark)}
.rolecard span{font-size:11.5px;color:var(--muted)}
/* Home tiles */
.hello{margin:2px 2px 12px}
.hello b{font-size:19px;color:var(--esm-dark);display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{position:relative;background:#fff;border-radius:14px;padding:14px 12px;box-shadow:var(--shadow);border:1px solid #eaeef4;cursor:pointer;min-height:96px}
.tile .ic{width:38px;height:38px;border-radius:11px;background:var(--esm-soft);color:var(--esm);display:grid;place-items:center;margin-bottom:8px}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-size:14.5px;color:var(--esm-dark)}
.tile span{font-size:12px;color:var(--muted)}
.tile .badge{position:absolute;top:10px;right:10px;background:var(--danger);color:#fff;border-radius:20px;font-size:12px;font-weight:800;padding:2px 8px}
.tile.main{grid-column:1/-1;background:var(--esm);border-color:var(--esm)}
.tile.main b,.tile.main span{color:#fff} .tile.main .ic{background:rgba(255,255,255,.18);color:#fff}
.section-t{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:6px 2px 8px}
/* Type grid */
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.typecard{background:#fff;border-radius:16px;border:1px solid #e3e9f2;box-shadow:var(--shadow);padding:8px 8px 12px;text-align:center;cursor:pointer}
.typecard img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block}
.typecard b{display:block;font-size:14px;color:var(--esm-dark);margin-top:2px}
.typecard span{font-size:12px;color:var(--muted)}
/* Lists */
.list{background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid #eaeef4;overflow:hidden;margin-bottom:14px}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid #eef2f7;cursor:pointer}
.li:first-child{border-top:none}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-size:15px;color:var(--ink)}
.li .main span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:#a3b3c9;font-size:20px}
.li input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;accent-color:var(--esm)}
.search{margin-bottom:10px}
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.filters button{flex:0 0 auto;border:1.5px solid var(--esm-line);background:#fff;color:var(--esm-dark);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.filters button.on{background:var(--esm);border-color:var(--esm);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted);line-height:1.1;display:block}
/* Mode switch */
.modesw{display:flex;background:var(--esm-soft);border-radius:12px;padding:4px;gap:4px;margin-bottom:6px}
.modesw button{flex:1;border:none;background:none;border-radius:9px;padding:9px 6px;font-size:13px;font-weight:700;color:var(--esm);cursor:pointer;line-height:1.15}
.modesw button.on{background:#fff;box-shadow:0 1px 4px rgba(3,71,152,.18)}
.modesw button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
/* Seal blocks */
.meterbox{background:#f6f9fd;border:1px dashed var(--esm-line);border-radius:12px;padding:10px;margin-bottom:12px}
.meterbox .t{font-size:12.5px;font-weight:800;color:var(--esm-dark);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.seal{border:1.5px solid var(--esm-line);border-radius:12px;padding:11px;margin-bottom:10px;background:#fff}
.seal.done{border-color:#bfe3cd}
.seal.bad{border-color:#efb7ae;background:#fffafa}
.seal .top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.seal .top .nm{flex:1;font-weight:800;font-size:14.5px;color:var(--esm-dark)}
.seal .top .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.camb{flex:0 0 auto;border:1.5px solid var(--esm);background:var(--esm-soft);color:var(--esm);border-radius:10px;
  height:42px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer}
.camb svg{width:20px;height:20px}
.camb.has{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.basebox{background:var(--esm-soft);border-radius:9px;padding:8px 10px;font-size:13px;margin-bottom:8px;color:var(--esm-dark)}
.basebox b{font-size:17px;letter-spacing:.5px}
.basebox span{color:var(--muted);font-size:11.5px;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg.g2{display:grid;grid-template-columns:1fr 1fr}
.seg button{flex:1 1 auto;border:1.5px solid var(--esm-line);background:#fff;border-radius:10px;padding:9px 8px;font-size:13.5px;font-weight:700;color:var(--esm-dark);cursor:pointer;min-height:42px}
.seg button.on.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.badb{background:var(--danger);border-color:var(--danger);color:#fff}
.seg button.on.greyb{background:var(--grey);border-color:var(--grey);color:#fff}
.seg button.on.blueb{background:var(--esm);border-color:var(--esm);color:#fff}
.numin{display:flex;gap:8px;margin-bottom:8px}
.numin input{font-size:18px;font-weight:700;letter-spacing:.5px}
.resline{margin-top:8px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.extra{margin-top:9px;padding-top:9px;border-top:1px dashed var(--esm-line)}
.ph{display:flex;align-items:center;gap:8px;margin-top:8px}
.ph img{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--esm-line);cursor:pointer}
.ph span{font-size:11.5px;color:var(--muted)}
.linkbtn{background:none;border:none;color:var(--esm);font-weight:700;font-size:13px;padding:4px 0;cursor:pointer;text-decoration:underline}
.progress{height:6px;background:var(--esm-soft);border-radius:6px;overflow:hidden;margin:4px 0 2px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:6px}
.note{background:#fffbea;border:1px solid #f1e2a8;color:#6e5600;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:12px}
.issue{color:var(--danger);font-size:13px;margin:3px 0}
/* Summary table */
table.sum{width:100%;border-collapse:collapse;font-size:13px}
table.sum th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--esm-line)}
table.sum td{padding:7px 4px;border-bottom:1px solid #eef2f7;vertical-align:top}
table.sum td.n{font-weight:700;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--esm-line);cursor:pointer}
.sigrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sigbox{border:1.5px solid var(--esm-line);border-radius:12px;padding:10px;text-align:center;background:#fbfdff;font-size:12.5px}
.sigbox .im{height:62px;display:grid;place-items:center;margin-bottom:4px}
.sigbox .im img{max-height:60px}
.sigbox b{display:block;color:var(--esm-dark)}
/* Alert cards */
.acard{background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid #eaeef4;border-left:5px solid var(--danger);padding:12px 13px;margin-bottom:10px}
.acard.closed{border-left-color:var(--ok)}
.acard .h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.acard .h b{flex:1;font-size:15px}
.acard .chg{font-size:14px;margin:4px 0}
.acard .chg s{color:var(--muted)}
/* Modal */
.modal{position:fixed;inset:0;z-index:150;background:rgba(10,25,50,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.modal .sheet h3{margin:0 0 4px;color:var(--esm-dark);font-size:17px}
.modal .sheet .acts{display:flex;gap:10px;margin-top:14px}
.modal .sheet .acts .btn{flex:1}
.imgview{position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:14px}
.imgview.on{display:flex}
.imgview img{max-height:92vh;border-radius:8px}
/* Signature overlay */
#sigOverlay{position:fixed;inset:0;z-index:200;background:#0b1f3a;display:none;flex-direction:column}
#sigOverlay.on{display:flex}
#sigOverlay .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff;flex-wrap:wrap;padding-top:max(8px,env(safe-area-inset-top))}
#sigOverlay .bar b{font-size:14px}
#sigOverlay .hint{color:#bcd3f2;font-size:11px}
#sigOverlay .sigbtns{display:flex;gap:8px;margin-left:auto}
#sigOverlay .sigbtns button{border:none;border-radius:9px;font-weight:700;font-size:14px;padding:10px 15px;cursor:pointer}
#sigOverlay .save{background:#19b36b;color:#fff} #sigOverlay .clear{background:#1b3a66;color:#cfe0f6} #sigOverlay .cancel{background:#3a4a63;color:#dfe7f3}
#sigCanvas{flex:1;width:100%;background:#fff;touch-action:none;display:block}
/* Toast / busy */
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(12px);z-index:220;background:#13294b;color:#fff;
  padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#busy{position:fixed;inset:0;z-index:230;background:rgba(10,25,50,.35);display:none;align-items:center;justify-content:center}
#busy.on{display:flex}
#busy div{background:var(--esm-dark);color:#fff;padding:13px 20px;border-radius:30px;font-size:14px;display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
@media (min-width:600px){ .typegrid{grid-template-columns:repeat(4,1fr)} .tiles{grid-template-columns:repeat(3,1fr)} .tile.main{grid-column:auto} }
</style>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
</head>
<body>
<header class="app">
  <div class="logo" data-act="go" data-to="#/home"><img src="img/logo-esm.png" alt="ESM"></div>
  <div class="ht">Control de Sellos<small id="hdrSub">Minera Centinela</small></div>
  <button class="hchip" id="hdrMode" data-act="go" data-to="#/ajustes" style="display:none">Modo B</button>
  <button class="hchip" id="hdrRole" data-act="go" data-to="#/ajustes" style="display:none">JT</button>
</header>
<div class="demo-banner">PROTOTIPO · datos de ejemplo · lo que registres se guarda solo en este teléfono</div>
<main id="view"></main>

<div id="sigOverlay">
  <div class="bar">
    <b id="sigTitle">Firma</b>
    <span class="hint">Firma con el dedo · gira el teléfono</span>
    <div class="sigbtns">
      <button class="clear" id="sigClear">Borrar</button>
      <button class="cancel" id="sigCancel">Cancelar</button>
      <button class="save" id="sigSave">✓ Guardar</button>
    </div>
  </div>
  <canvas id="sigCanvas"></canvas>
</div>
<div class="modal" id="modal"><div class="sheet" id="modalSheet"></div></div>
<div class="imgview" id="imgview" data-act="closeimg"><img id="imgviewImg" alt=""></div>
<div id="toast"></div>
<div id="busy"><div><span class="spin"></span><span id="busyTxt">Generando PDF…</span></div></div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>

<script src="data.js"></script>
<script>
'use strict';
/* =====================================================================
   ESM · Control de Sellos v2 — PROTOTIPO
   Todo funciona en el teléfono: los datos se guardan en este navegador
   (IndexedDB). En la app real, los datos irán a Cloudflare (D1 + R2).
   ===================================================================== */
const $ = s => document.querySelector(s);
const D = window.SELLOS_DATA;
const P = Object.fromEntries(D.points.map(p => [p.id, p]));
const T = Object.fromEntries(D.types.map(t => [t.id, t]));
const ROLES = {
  JT:  { name: 'Jefe de Turno', short: 'JT', desc: 'Controla en terreno' },
  SO:  { name: 'Supervisor de Operaciones', short: 'SO', desc: 'Controla y valida al JT' },
  SM:  { name: 'Supervisor de Mantenimiento', short: 'SM', desc: 'Cierra alertas y registra calibraciones' },
  ADC: { name: 'Administrador de Contrato', short: 'AdC', desc: 'Valida al SO' }
};
const SHORT = { camion: 'Camiones', petrolera: 'Petroleras', eds: 'Estaciones', tanque: 'Tanque' };
const FORM = { code: 'PN.OM.DM.MN.F.04', version: '1', date: 'oct-2026', title: 'REGISTRO DE CONTROL DE SELLOS' };
const RES = {
  ok:       { t: 'Coincide', c: 'ok' },
  distinto: { t: 'Distinto · ALERTA', c: 'alert' },
  sinsello: { t: 'Sin sello · ALERTA', c: 'alert' },
  difref:   { t: 'Distinto a la referencia (revisar)', c: 'warn' },
  primer:   { t: 'Primer registro', c: 'info' },
  na:       { t: 'No aplica', c: 'grey' }
};
const RES_PDF = { ok: { t: 'Coincide' }, distinto: { t: 'DISTINTO (alerta)' }, sinsello: { t: 'SIN SELLO (alerta)' }, difref: { t: 'Distinto a ref. (revisar)' }, primer: { t: 'Primer registro' }, na: { t: 'No aplica' } };
const ICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

/* ---------------- Utilidades ---------------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
function localStr(d) { d = d || new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function ago(days, hours) { const d = new Date(); d.setDate(d.getDate() - days); d.setHours(hours == null ? d.getHours() : hours, hours == null ? d.getMinutes() : 10, 0, 0); return localStr(d); }
function fmtDT(s) { if (!s) return '—'; const d = new Date(s); if (isNaN(d)) return s; return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtD(s) { if (!s) return ''; const d = new Date(s.length === 10 ? s + 'T12:00' : s); if (isNaN(d)) return s; return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()}`; }
function daysSince(s) { return (Date.now() - new Date(s).getTime()) / 864e5; }
function agoTxt(s) { const a = new Date(s), b = new Date(); a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0); const d = Math.round((b - a) / 864e5); return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`; }
function norm(v) {
  let s = String(v == null ? '' : v).toUpperCase().replace(/ESM/g, '').replace(/[^A-Z0-9]/g, '');
  s = s.replace(/^0+(?=\d)/, '');
  return s;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600); }
function busy(on, txt) { $('#busyTxt').textContent = txt || 'Generando PDF…'; $('#busy').classList.toggle('on', !!on); }
function meterTxt(m) { return 'N° de serie: ' + esc(m.serial || '—') + (m.model ? ' · Modelo: ' + esc(m.model) : ''); }

/* ---------------- Almacenamiento (IndexedDB con respaldo en memoria) ---------------- */
const Store = {
  db: null, mem: {},
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('esm-sellos-demo', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => { this.db = rq.result; res(); };
        rq.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  get(k) {
    return new Promise(res => {
      if (!this.db) return res(this.mem[k]);
      try { const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(this.mem[k]); }
      catch (e) { res(this.mem[k]); }
    });
  },
  set(k, v) {
    this.mem[k] = v;
    return new Promise(res => {
      if (!this.db) return res();
      try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); }
      catch (e) { res(); }
    });
  }
};

function demoSig(seed) {
  const c = document.createElement('canvas'); c.width = 360; c.height = 120; const x = c.getContext('2d');
  x.strokeStyle = '#0b1f3a'; x.lineWidth = 3; x.lineCap = 'round'; x.beginPath();
  let px = 20, py = 70; x.moveTo(px, py);
  for (let i = 1; i <= 26; i++) { const nx = 20 + i * 12; const ny = 60 + Math.sin(i * (0.9 + seed * 0.13)) * 28 + Math.cos(i * 0.5 + seed) * 10; x.quadraticCurveTo(px + 6, py - 18, nx, ny); px = nx; py = ny; }
  x.stroke(); x.beginPath(); x.moveTo(40, 95); x.lineTo(320, 88); x.stroke();
  return c.toDataURL('image/png');
}

/* Cierra un control: crea alertas y actualiza la base. Se usa al firmar y al sembrar. */
function finalizeControl(c, sigImg, firma2, base, meters) {
  base = base || S.base; meters = meters || S.meters;
  const p = P[c.pid];
  c.id = 'C' + (++S.seq.c);
  c.n = 'SC-' + String(S.seq.c).padStart(4, '0');
  c.firma1 = { role: c.by.role, name: c.by.name, at: c.closedAt || c.dt, img: sigImg };
  c.firma2 = firma2 || null;
  c.validatorRole = validatorOf(c.by.role);
  c.status = firma2 ? 'validado' : 'pendiente';
  c.alertIds = [];
  if (!c.fuera) {
    p.comps.forEach(comp => {
      const r = c.comps[comp.id]; if (!r) return;
      comp.seals.forEach(s => {
        const x = r.seals[s.id]; if (!x) return;
        if (x.result === 'distinto' || x.result === 'sinsello') {
          const a = { id: 'A' + (++S.seq.a), controlId: c.id, controlN: c.n, pid: c.pid, cid: comp.id, sid: s.id,
            where: comp.name + ' · ' + s.name, kind: x.result, prev: x.prev, curr: x.num, motivo: x.motivo || '', obs: x.obs || '',
            photo: x.photo || null, at: c.dt, by: c.by, status: 'abierta', cierre: null, seeded: !!c.seeded };
          S.alerts.push(a); c.alertIds.push(a.id);
        }
        // Actualiza la base: lo registrado hoy es la referencia del próximo control
        const B = base[c.pid][comp.id] = base[c.pid][comp.id] || {};
        if (x.result === 'na') B[s.id] = { num: null, na: true, naReason: x.naReason || '', date: c.dt, label: 'Control ' + c.n, source: 'app' };
        else if (x.result === 'sinsello') B[s.id] = { num: null, sinSello: true, date: c.dt, label: 'Control ' + c.n, source: 'app' };
        else if (x.num) B[s.id] = { num: x.num, date: c.dt, label: 'Control ' + c.n, source: 'app' };
      });
      if (r.meter && (r.meter.serial || r.meter.model)) {
        if (r.meter.result === 'distinto') {
          const a = { id: 'A' + (++S.seq.a), controlId: c.id, controlN: c.n, pid: c.pid, cid: comp.id, sid: 'meter',
            where: comp.name + ' · N° de serie del meter', kind: 'meter', prev: r.meter.prevSerial, curr: r.meter.serial,
            motivo: r.meter.motivo || '', obs: r.meter.obs || '', photo: r.meter.photo || null, at: c.dt, by: c.by, status: 'abierta', cierre: null };
          S.alerts.push(a); c.alertIds.push(a.id);
        }
        meters[c.pid][comp.id] = { serial: r.meter.serial, model: r.meter.model, date: c.dt, label: 'Control ' + c.n, source: 'app' };
      }
    });
  }
  S.controls.push(c);
  return c;
}

/* ---------------- Cálculo de resultados ---------------- */
function getBase(pid, cid, sid) { return ((S.base[pid] || {})[cid] || {})[sid] || null; }
function compareSeal(b, num) {
  if (!norm(num)) return null;
  if (!b || (!b.num)) return 'primer';
  if (norm(b.num) === norm(num)) return 'ok';
  return b.source === 'referencia' ? 'difref' : 'distinto';
}
function compareMeter(m, serial) {
  if (!norm(serial)) return null;
  if (!m || !m.serial) return 'primer';
  if (norm(m.serial) === norm(serial)) return 'ok';
  return m.source === 'referencia' ? 'difref' : 'distinto';
}
function baseTxt(b) {
  if (!b) return '<span>Sin registro anterior: este control será la base.</span>';
  const dd = b.date ? fmtD(b.date) : ''; const lb = b.label || '';
  const src = `${esc(lb)}${dd && !lb.includes(dd) && !lb.includes(dd.replace(/-/g, '/')) ? ' · ' + dd : ''}${b.source === 'referencia' ? ' (referencia)' : ''}`;
  if (b.na) return `Último registro: <b>No aplica</b><span>${esc(b.naReason || '')} · ${src}</span>`;
  if (b.sinSello) return `Último registro: <b>Sin sello</b><span>${src}</span>`;
  return `Último registro: <b>${esc(b.num)}</b><span>${src}</span>`;
}
function pointStatus(pid) {
  const cs = S.controls.filter(c => c.pid === pid).sort((a, b) => b.dt.localeCompare(a.dt));
  const open = S.alerts.filter(a => a.pid === pid && a.status === 'abierta').length;
  const last = cs[0];
  const lastMonthly = cs.find(c => c.by.role === 'SO' || c.by.role === 'ADC');
  const info = { last, open, lastMonthly };
  if (open) return Object.assign(info, { key: 'alerta', t: open === 1 ? 'Alerta abierta' : open + ' alertas abiertas', c: 'alert' });
  if (!last) return Object.assign(info, { key: 'sinreg', t: 'Sin control en la app', c: 'grey' });
  if (last.fuera && daysSince(last.dt) <= 7) return Object.assign(info, { key: 'fuera', t: 'Fuera de faena', c: 'grey' });
  if (daysSince(last.dt) <= 7) return Object.assign(info, { key: 'aldia', t: 'Al día', c: 'ok' });
  return Object.assign(info, { key: 'vencido', t: 'Control semanal vencido', c: 'warn' });
}

/* ---------------- Fotos (solo cámara, comprimidas) ---------------- */
let photoTarget = null;
function compressImage(file, max, q) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const sc = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * sc); h = Math.round(h * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); // el navegador aplica la orientación EXIF
      const url = c.toDataURL('image/jpeg', q); URL.revokeObjectURL(img.src);
      res({ url, kb: Math.round(url.length * 0.75 / 1024) });
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(file);
  });
}
$('#camInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f || !photoTarget) return;
  busy(true, 'Procesando foto…');
  const r = await compressImage(f, 1024, 0.6);
  busy(false);
  if (!r) { toast('No se pudo leer la foto'); return; }
  const [a, b] = photoTarget.split('.');
  if (a === 'cal') { cal.seals[b] = Object.assign(cal.seals[b] || {}, { photo: r.url }); route(); return; }
  const comp = S.draft.comps[a];
  if (b === 'meter') { comp.meter.photo = r.url; save(); route(); return; }
  const x = comp.seals[b]; x.photo = r.url; x.photoKB = r.kb; save();
  refreshSeal(photoTarget);
  toast(`Foto guardada · ${r.kb} KB`);
});

/* ---------------- Firma ---------------- */
const sigCanvas = $('#sigCanvas'); let sctx, drawing = false, hasInk = false, last = null, sigCb = null;
function openSig(title, cb) {
  sigCb = cb; $('#sigTitle').textContent = title; $('#sigOverlay').classList.add('on');
  try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
  setTimeout(setupSig, 150);
}
function setupSig() {
  const r = sigCanvas.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
  sigCanvas.width = r.width * dpr; sigCanvas.height = r.height * dpr;
  sctx = sigCanvas.getContext('2d'); sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.lineWidth = 3; sctx.lineCap = 'round'; sctx.lineJoin = 'round'; sctx.strokeStyle = '#0b1f3a'; hasInk = false;
}
window.addEventListener('resize', () => { if ($('#sigOverlay').classList.contains('on') && !hasInk) setupSig(); });
function sigPos(e) { const r = sigCanvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
sigCanvas.addEventListener('pointerdown', e => { e.preventDefault(); drawing = true; last = sigPos(e); });
sigCanvas.addEventListener('pointermove', e => { if (!drawing) return; e.preventDefault(); const q = sigPos(e); sctx.beginPath(); sctx.moveTo(last.x, last.y); sctx.lineTo(q.x, q.y); sctx.stroke(); last = q; hasInk = true; });
window.addEventListener('pointerup', () => { drawing = false; });
$('#sigClear').onclick = setupSig;
$('#sigCancel').onclick = closeSig;
$('#sigSave').onclick = () => { if (!hasInk) { toast('Dibuja la firma primero'); return; } const img = trimSig(sigCanvas); closeSig(); if (sigCb) sigCb(img); };
function closeSig() {
  $('#sigOverlay').classList.remove('on');
  try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
}
function trimSig(cv) {
  const ctx = cv.getContext('2d'); const w = cv.width, h = cv.height; const d = ctx.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = 0, maxY = 0, found = false;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) { const i = (y * w + x) * 4; if (d[i + 3] > 20) { found = true; if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; } }
  if (!found) return cv.toDataURL('image/png');
  const pd = 12; minX = Math.max(0, minX - pd); minY = Math.max(0, minY - pd); maxX = Math.min(w, maxX + pd); maxY = Math.min(h, maxY + pd);
  const o = document.createElement('canvas'); const sc = Math.min(1, 600 / (maxX - minX));
  o.width = Math.round((maxX - minX) * sc); o.height = Math.round((maxY - minY) * sc);
  o.getContext('2d').drawImage(cv, minX, minY, maxX - minX, maxY - minY, 0, 0, o.width, o.height);
  return o.toDataURL('image/png');
}

  },
  sign1() {

          seals[s.id] = { result: x.result, num: x.result === 'sinsello' || x.result === 'na' ? '' : norm(x.num) ? String(x.num).trim().toUpperCase() : '', prev: b ? (b.num || (b.na ? 'N/A' : b.sinSello ? 'Sin sello' : null)) : null,
            prevLabel: b ? b.label : '', photo: x.photo, photoKB: x.photoKB, motivo: x.motivo, obs: x.obs, naReason: x.naReason }; });

      });

  bsel(el) { const id = el.dataset.id; el.checked ? bandejaSel.add(id) : bandejaSel.delete(id); const b = $('#btnSign2'); if (b) { b.disabled = !bandejaSel.size; b.textContent = `Firmar seleccionados (${bandejaSel.size})`; } },
  bselall() { pendingFor(S.user.role).forEach(c => bandejaSel.add(c.id)); route(); },
  sign2() { const ids = [...bandejaSel]; if (!ids.length) return; signValidate(ids); },
  sign2one(el) { signValidate([el.dataset.id]); },
  atab(el) { alertTab = el.dataset.v; route(); },
  closealert(el) {
    const a = S.alerts.find(x => x.id === el.dataset.id);
    modal(`<h3>Cerrar alerta</h3><p class="small muted">${esc(P[a.pid].name)} · ${esc(a.where)}</p>
      <div class="field"><label class="l">Causa</label><select id="cCausa"><option value="">Elegir…</option>${D.causasCierre.map(x => `<option>${esc(x)}</option>`).join('')}</select></div>
      <div class="field"><label class="l">Comentario</label><textarea id="cCom" placeholder="Qué se revisó y qué se hizo"></textarea></div>
      <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" data-act="closealertok" data-id="${a.id}">Cerrar alerta</button></div>`);
  },
  closealertok(el) {
    const causa = $('#cCausa').value; if (!causa) { toast('Elige la causa'); return; }
    const a = S.alerts.find(x => x.id === el.dataset.id);

    save(); closeModal(); route(); toast('Alerta cerrada');
  },
  pfilter(el) { ptFilter = el.dataset.v; route(); },
  hmine(el) { histMine = el.dataset.v === '1'; route(); },
  savecal() {
    const p = P[cal.pid]; const c = p && p.comps.find(x => x.id === cal.cid); if (!c) return;
    const changes = [];
    for (const s of c.seals) { const x = cal.seals[s.id]; if (x && norm(x.num)) { if (!x.photo) { toast(`Falta la foto del sello nuevo: ${s.name}`); return; } changes.push({ sid: s.id, name: s.name, prev: (getBase(p.id, c.id, s.id) || {}).num || null, num: String(x.num).trim().toUpperCase(), photo: x.photo }); } }
    const m = (S.meters[p.id] || {})[c.id];
    const serial = (cal.meterSerial || (m ? m.serial : '') || '').trim(), model = (cal.meterModel || (m ? m.model : '') || '').trim();
    const meterChanged = c.kind !== 'valvulas' && (serial !== (m ? m.serial : '') || model !== (m ? m.model : ''));
    if (!changes.length && !meterChanged) { toast('No hay sellos nuevos ni cambio de meter para registrar'); return; }
    const at = localStr(); const label = `Calibración ${cal.empresa} ${cal.cert ? 'N° ' + cal.cert : ''}`.trim();
    changes.forEach(ch => { S.base[p.id][c.id] = S.base[p.id][c.id] || {}; S.base[p.id][c.id][ch.sid] = { num: ch.num, date: cal.fecha, label, source: 'calibracion' }; });

    let closed = 0;
    if (cal.closeAlerts) S.alerts.filter(a => a.pid === p.id && a.cid === c.id && a.status === 'abierta').forEach(a => { a.status = 'cerrada'; a.cierre = { causa: 'Calibración ' + cal.empresa, comentario: label, by: { role: 'SM', name: S.user.name }, at }; closed++; });
    S.calibs.push({ id: 'K' + (++S.seq.k), pid: p.id, cid: c.id, empresa: cal.empresa, cert: cal.cert, fecha: cal.fecha, changes, meter: meterChanged ? { serial, model } : null, by: { role: 'SM', name: S.user.name }, at });
    cal = null; save(); go('#/punto/' + p.id);
    toast(`Calibración guardada${closed ? ' · ' + closed + ' alerta(s) cerrada(s)' : ''}`);
  },
  pdf(el) { buildPDF(S.controls.find(c => c.id === el.dataset.id)); },
  reset() {
    modal(`<h3>¿Reiniciar la demo?</h3><p class="small">Se borra todo lo registrado en este teléfono y se vuelve a los ejemplos iniciales.</p>
      <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn danger" data-act="resetok">Reiniciar</button></div>`);
  },
  async resetok() { const u = S.user; seedState(); S.user = u; await saveNow(); closeModal(); go('#/home'); toast('Demo reiniciada'); }
};
function signValidate(ids) {
  openSig('Firma del validador', img => {
    const at = localStr();
    ids.forEach(id => { const c = S.controls.find(x => x.id === id); if (c && c.status === 'pendiente') { c.firma2 = { role: S.user.role, name: S.user.name, at, img }; c.status = 'validado'; } });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  fn(el, e);
});
/* Entradas de texto */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'ptSearch') { ptSearch = el.value; $('#ptList').innerHTML = ptListHTML(el.dataset.type); return; }
  if (!S.draft && !el.dataset.cbind && !el.dataset.calseal) return;
  if (el.dataset.bind) { S.draft[el.dataset.bind] = el.value; save(); return; }
  if (el.dataset.sbind) {
    const [cid, sid] = el.dataset.sbind.split('.'); const x = S.draft.comps[cid].seals[sid];
    x.num = el.value; x.result = compareSeal(getBase(S.draft.pid, cid, sid), el.value); if (x.choice === 'si') x.choice = null;
    save(); refreshSealResult(el.dataset.sbind); return;
  }
  if (el.dataset.sxbind) { const [cid, sid, f] = el.dataset.sxbind.split('.'); S.draft.comps[cid].seals[sid][f] = el.value; save();
    if (f === 'motivo') refreshSealResult(cid + '.' + sid); else refreshProgress(); return; }
  if (el.dataset.mbind) {
    const [cid, f] = el.dataset.mbind.split('.'); const m = S.draft.comps[cid].meter; m[f] = el.value;
    if (f === 'serial') { m.result = compareMeter((S.meters[S.draft.pid] || {})[cid], el.value); document.getElementById('mres-' + cid).innerHTML = meterResHTML(cid, m); }
    save(); return;
  }
  if (el.dataset.calseal) { cal.seals[el.dataset.calseal] = Object.assign(cal.seals[el.dataset.calseal] || {}, { num: el.value }); return; }
  if (el.dataset.cbind && el.type !== 'checkbox' && el.tagName === 'INPUT') { cal[el.dataset.cbind] = el.value; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.cbind) {
    const k = el.dataset.cbind; cal[k] = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'pid') { cal.cid = ''; cal.seals = {}; cal.meterSerial = ''; cal.meterModel = ''; }
    if (k === 'cid') { cal.seals = {}; cal.meterSerial = ''; cal.meterModel = ''; }
    if (el.tagName === 'SELECT' || el.type === 'checkbox') route();
  }
  if (el.dataset.sxbind && el.tagName === 'SELECT') { const [cid, sid, f] = el.dataset.sxbind.split('.'); S.draft.comps[cid].seals[sid][f] = el.value; save(); refreshSealResult(cid + '.' + sid); }
  if (el.dataset.mbind && el.tagName === 'SELECT') { const [cid, f] = el.dataset.mbind.split('.'); S.draft.comps[cid].meter[f] = el.value; save(); }
});

/* ---------------- PDF ---------------- */
let LOGO = null;
async function loadLogo() {
  try { const r = await fetch('img/logo-esm.png'); const b = await r.blob(); LOGO = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); }); } catch (e) { LOGO = null; }
}
function imgSize(src) { return new Promise(res => { const i = new Image(); i.onload = () => res({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => res({ w: 4, h: 3 }); i.src = src; }); }
async function buildPDF(c) {
  if (!c) return;
  if (!window.jspdf) { toast('No se pudo cargar el generador de PDF (revisa la conexión una vez)'); return; }
  busy(true);
  try {
    const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const W = 210, M = 12, CW = W - 2 * M; const p = P[c.pid];
    const blue = [3, 71, 152], dark = [2, 51, 104], line = [199, 214, 234];
    let y = M;
    const setF = (sz, st, col) => { doc.setFontSize(sz); doc.setFont('helvetica', st || 'normal'); doc.setTextColor(...(col || [26, 34, 49])); };
    const box = (x, yy, w, h, fill) => { doc.setDrawColor(...line); doc.setLineWidth(0.3); if (fill) { doc.setFillColor(...fill); doc.rect(x, yy, w, h, 'FD'); } else doc.rect(x, yy, w, h); };
    const ensure = h => { if (y + h > 285) { doc.addPage(); y = M; } };
    // Encabezado
    box(M, y, 40, 20); if (LOGO) try { doc.addImage(LOGO, 'PNG', M + 4, y + 4.5, 32, 10.6); } catch (e) {}
    box(M + 40, y, CW - 40 - 48, 20); setF(11, 'bold', dark); doc.text(FORM.title, M + 40 + (CW - 88) / 2, y + 9, { align: 'center' });
    setF(8.5, 'normal'); doc.text('Medidores, registradores y válvulas · Minera Centinela', M + 40 + (CW - 88) / 2, y + 14.5, { align: 'center' });
    const rx = M + CW - 48; [['Código', FORM.code], ['Versión', FORM.version], ['Fecha', FORM.date]].forEach((r, i) => { box(rx, y + i * 6.67, 16, 6.67, [232, 240, 251]); box(rx + 16, y + i * 6.67, 32, 6.67); setF(7.5, 'bold', dark); doc.text(r[0], rx + 2, y + i * 6.67 + 4.4); setF(7.5, 'normal'); doc.text(r[1], rx + 18, y + i * 6.67 + 4.4); });
    y += 24;
    setF(10, 'bold', c.status === 'validado' ? [31, 157, 87] : [184, 106, 6]);
    doc.text(`N° ${c.n} · ${c.status === 'validado' ? 'VALIDADO' : 'PENDIENTE DE VALIDACIÓN'}`, M, y + 3); y += 7;
    // Datos
    const kv = [['Tipo de punto', T[p.type].name], ['Punto', p.name + (p.sub ? ' · ' + p.sub : '')], ['Fecha y hora de la inspección', fmtDT(c.dt)],
      ['Controló', `${c.by.name} · ${ROLES[c.by.role].name}`], ['Forma de confirmar el número', c.mode === 'A' ? 'A · la app muestra el número anterior' : 'B · se escribe el número leído y la app compara']];
    if (c.fuera) kv.push(['Equipo fuera de faena', c.fuera.lugar + (c.fuera.obs ? ' · ' + c.fuera.obs : '')]);
    kv.forEach(r => { box(M, y, 58, 6.5, [232, 240, 251]); box(M + 58, y, CW - 58, 6.5); setF(8, 'bold', dark); doc.text(r[0], M + 2, y + 4.4); setF(8.5, 'normal'); doc.text(doc.splitTextToSize(r[1], CW - 62)[0], M + 60, y + 4.4); y += 6.5; });
    y += 5;
    // Componentes
    const photos = [];
    if (!c.fuera) for (const comp of p.comps) {
      const r = c.comps[comp.id]; if (!r) continue;
      ensure(30);
      doc.setFillColor(...blue); doc.rect(M, y, CW, 7, 'F'); setF(9, 'bold', [255, 255, 255]); doc.text(comp.name + (comp.sub ? '  ·  ' + comp.sub : ''), M + 2, y + 4.8); y += 7;
      if (r.meter && (r.meter.serial || r.meter.model || r.meter.prevSerial)) {
        box(M, y, CW, 6.5); setF(8, 'normal');
        let t = `N° de serie: ${r.meter.serial || '—'}   ·   Modelo: ${r.meter.model || '—'}   ·   Anterior: ${r.meter.prevSerial || '—'}`;
        if (r.meter.result === 'distinto') t += `   ·   CAMBIO DE METER (ALERTA)${r.meter.motivo ? ' · ' + r.meter.motivo : ''}`;
        doc.text(t, M + 2, y + 4.4);
        if (r.meter.photo) { photos.push({ src: r.meter.photo, cap: `${comp.name} · placa del meter · ${r.meter.serial || ''}` }); doc.text(`Foto ${photos.length}`, M + CW - 2, y + 4.4, { align: 'right' }); }
        y += 6.5;
      }
      const cols = [64, 30, 30, 44, CW - 168]; const hd = ['Sello', 'N° anterior', 'N° actual', 'Resultado', 'Foto'];
      let x = M; hd.forEach((h, i) => { box(x, y, cols[i], 6, [232, 240, 251]); setF(7.5, 'bold', dark); doc.text(h, x + 1.5, y + 4); x += cols[i]; }); y += 6;
      for (const s of comp.seals) {
        const sx = r.seals[s.id]; if (!sx) continue;
        const extra = [sx.motivo ? 'Motivo: ' + sx.motivo : '', sx.obs || '', sx.result === 'na' ? (sx.naReason || '') : ''].filter(Boolean).join(' · ');
        const extraLines = extra ? doc.splitTextToSize(extra, cols[0] - 3) : [];
        const h = 6 + extraLines.length * 3.4; ensure(h);
        let ph = '';
        if (sx.photo) { photos.push({ src: sx.photo, cap: `${comp.name} · ${s.name} · N° ${sx.num || '—'}` }); ph = 'Foto ' + photos.length; }
        const R = RES_PDF[sx.result] || { t: '—' };
        const vals = [s.name + (s.tentative ? ' *' : ''), sx.prev || '—', sx.result === 'sinsello' ? '—' : sx.result === 'na' ? 'N/A' : (sx.num || '—'), R.t, ph];
        x = M; vals.forEach((v, i) => { box(x, y, cols[i], h); const bad = i === 3 && (sx.result === 'distinto' || sx.result === 'sinsello');
          setF(i === 0 ? 8 : 8.5, i === 2 || i === 1 ? 'bold' : 'normal', bad ? [192, 57, 43] : i === 3 && sx.result === 'difref' ? [184, 106, 6] : [26, 34, 49]);
          doc.text(doc.splitTextToSize(String(v), cols[i] - 3)[0], x + 1.5, y + 4.2); x += cols[i]; });
        if (extraLines.length) { setF(7, 'normal', [91, 106, 130]); doc.text(extraLines, M + 1.5, y + 7.6); }
        y += h;
      }
      y += 4;
    }
    // Alertas
    if (c.alertIds.length) {
      ensure(14); setF(9.5, 'bold', [192, 57, 43]); doc.text(`Alertas generadas (${c.alertIds.length})`, M, y + 4); y += 6;
      c.alertIds.forEach(id => { const a = S.alerts.find(z => z.id === id); if (!a) return; ensure(6);
        const t = `• ${a.where}: ${a.kind === 'sinsello' ? 'sin sello' : (a.prev || '—') + ' -> ' + (a.curr || '—')}${a.motivo ? ' · motivo informado: ' + a.motivo : ''}${a.cierre ? ' · CERRADA: ' + a.cierre.causa + ' (' + a.cierre.by.name + ', ' + fmtDT(a.cierre.at) + ')' : ' · abierta'}`;
        setF(8, 'normal'); const ls = doc.splitTextToSize(t, CW); doc.text(ls, M, y + 3.5); y += ls.length * 3.8 + 1; });
      y += 2;
    }
    if (c.obs) { ensure(12); setF(8.5, 'bold', dark); doc.text('Observación general', M, y + 4); setF(8.5, 'normal'); const ls = doc.splitTextToSize(c.obs, CW); doc.text(ls, M, y + 9); y += 9 + ls.length * 4; }
    if (!c.fuera && p.comps.some(cc => cc.seals.some(s => s.tentative))) { ensure(6); setF(7, 'normal', [91, 106, 130]); doc.text('* Sello por confirmar en la definición del prototipo.', M, y + 3); y += 6; }
    // Firmas
    ensure(42); y += 2; const fw = (CW - 8) / 2;
    const sigBox = async (x, title, f, pendingRole) => {
      box(x, y, fw, 38); setF(8.5, 'bold', dark); doc.text(title, x + fw / 2, y + 5, { align: 'center' });
      if (f && f.img) { const sz = await imgSize(f.img); const iw = Math.min(fw - 20, 18 * sz.w / sz.h); const ih = iw * sz.h / sz.w; try { doc.addImage(f.img, 'PNG', x + (fw - iw) / 2, y + 7, iw, Math.min(ih, 18)); } catch (e) {} }
      setF(8, 'normal');
      if (f) { doc.text(f.name, x + fw / 2, y + 29, { align: 'center' }); doc.text(`${ROLES[f.role].name} · ${fmtDT(f.at)}`, x + fw / 2, y + 33.5, { align: 'center' }); }
      else { setF(8.5, 'italic', [184, 106, 6]); doc.text('Pendiente de validación', x + fw / 2, y + 20, { align: 'center' }); setF(8, 'normal'); doc.text(roleName(pendingRole), x + fw / 2, y + 33.5, { align: 'center' }); }
    };
    await sigBox(M, 'Controló', c.firma1, null);
    await sigBox(M + fw + 8, 'Validó', c.firma2, c.validatorRole);
    y += 42;
    // Anexo fotográfico
    if (photos.length) {
      doc.addPage(); y = M; setF(12, 'bold', dark); doc.text(`Anexo fotográfico · ${c.n} · ${p.name}`, M, y + 5); y += 10;
      const cw = (CW - 6) / 2, chMax = 72;
      for (let i = 0; i < photos.length; i++) {
        const col = i % 2; if (col === 0 && i > 0) y += chMax + 12;
        if (y + chMax + 10 > 287) { doc.addPage(); y = M; }
        const x = M + col * (cw + 6); const sz = await imgSize(photos[i].src);
        let iw = cw, ih = cw * sz.h / sz.w; if (ih > chMax) { ih = chMax; iw = chMax * sz.w / sz.h; }
        box(x, y, cw, chMax); try { doc.addImage(photos[i].src, 'JPEG', x + (cw - iw) / 2, y + (chMax - ih) / 2, iw, ih); } catch (e) {}
        setF(7.5, 'normal'); doc.text(doc.splitTextToSize(`Foto ${i + 1} · ${photos[i].cap}`, cw)[0], x, y + chMax + 4.5);
      }
    }
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) { doc.setPage(i); setF(7, 'normal', [120, 130, 145]); doc.text(`${FORM.code} v${FORM.version} · ${c.n} · PROTOTIPO con datos de ejemplo · Página ${i} de ${n}`, W / 2, 292, { align: 'center' }); }
    doc.save(`${c.n}_${p.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '_')}_${c.dt.slice(0, 10)}.pdf`);
  } catch (err) { console.error(err); toast('Error al generar el PDF'); }
  busy(false);
}

/* ---------------- Inicio ---------------- */
(async function init() {
  await Store.open();
  const saved = await Store.get('state');
  if (saved && saved.v === 3) S = saved; else { seedState(); await saveNow(); }
  loadLogo();
  route();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
